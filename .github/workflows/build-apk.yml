name: Build VMTMC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract VMTMC project ZIP
        run: |
          mkdir -p build-project
          unzip -q VMTMC-GitHub-Ready-Fixed.zip -d build-project

          if [ -d "build-project/VMTMC" ]; then
            mv build-project/VMTMC/* build-project/
            mv build-project/VMTMC/.[!.]* build-project/ 2>/dev/null || true
          fi

          cd build-project
          find . -maxdepth 2 -type f | head -50

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: build-project
        run: gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VMTMC-release-apk
          path: build-project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
